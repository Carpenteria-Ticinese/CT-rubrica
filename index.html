<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Anagrafiche — Carpenteria Ticinese</title>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icone/icona.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone/icona-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

<!-- ── Login ───────────────────────────────────────────────────────────── -->
<main id="pagina-login" class="pagina-centrata" hidden>
  <form id="login-form" class="scatola" novalidate>
    <img src="icone/icona.svg" alt="" class="logo-login" width="72" height="72">
    <div class="ditta">Carpenteria Ticinese</div>
    <h1>Anagrafiche</h1>
    <p class="nota">Entra con la stessa email e password delle altre app.</p>
    <div id="login-avviso"></div>
    <div class="campo"><label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="username" inputmode="email"></div>
    <div class="campo"><label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password"></div>
    <button id="login-entra" type="submit" class="btn btn-primario btn-largo">Entra</button>
  </form>
</main>

<!-- ── Non autorizzato ─────────────────────────────────────────────────── -->
<main id="pagina-negato" class="pagina-centrata" hidden>
  <div class="scatola">
    <div class="ditta">Carpenteria Ticinese</div>
    <h1>Anagrafiche</h1>
    <div id="negato-testo"></div>
    <button id="negato-esci" type="button" class="btn btn-secondario btn-largo" data-ico="esci"><span>Esci</span></button>
  </div>
</main>

<!-- ── App ─────────────────────────────────────────────────────────────── -->
<div id="pagina-app" hidden>
  <header class="testata">
    <div class="testata-testo">
      <div class="ditta">Carpenteria Ticinese</div>
      <h1 id="titolo-sezione">Commesse</h1>
    </div>
    <div class="testata-utente">
      <span id="utente" class="utente"></span>
      <button id="esci" type="button" class="btn btn-testo" data-ico="esci"><span>Esci</span></button>
    </div>
  </header>

  <nav class="menu" aria-label="Sezioni">
    <a href="#commesse" class="menu-voce" data-menu="commesse" data-ico="commesse"><span>Commesse</span></a>
    <a href="#persone" class="menu-voce" data-menu="persone" data-ico="persone"><span>Persone</span></a>
    <a href="#contatti" class="menu-voce" data-menu="contatti" data-ico="contatti"><span>Contatti</span></a>
  </nav>

  <main class="contenuto">
    <section id="pane-elenco" class="pane pane-elenco" aria-label="Elenco"></section>
    <section id="pane-dettaglio" class="pane pane-dettaglio" aria-label="Scheda"></section>
  </main>

  <footer class="piede">Anagrafiche · versione <span id="versione"></span></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js?v=3"></script>
<script src="js/comune.js?v=3"></script>
<script src="js/dati.js?v=3"></script>
<script src="js/cap.js?v=3"></script>
<script src="js/commesse.js?v=3"></script>
<script src="js/persone.js?v=3"></script>
<script src="js/contatti.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
